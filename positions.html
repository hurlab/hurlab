<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z36JMZ1F1K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Z36JMZ1F1K');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Open positions and opportunities at the Hur Lab, University of North Dakota">
  <meta property="og:title" content="Opportunities - Hur Lab">
  <meta property="og:description" content="Open positions and opportunities at the Hur Lab, University of North Dakota">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hurlab.med.und.edu/hurlab/positions.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Positions - Hur Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body class="bg-surface font-sans text-gray-800 antialiased">

  <!-- Navigation injected by components.js -->
  <div id="nav-placeholder"></div>

  <!-- ==================== HEADER BANNER ==================== -->
  <section class="bg-hero-pattern py-16 text-center">
    <div class="max-w-4xl mx-auto px-6" data-aos="fade-up">
      <h1 class="text-4xl sm:text-5xl font-bold text-white mb-4">Opportunities</h1>
      <p class="text-lg sm:text-xl text-teal-200/90 max-w-2xl mx-auto">
        Future opportunities for motivated researchers passionate about computational biology and AI
      </p>
    </div>
  </section>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12 py-16 lg:py-24"
        x-data="{
          data: null,
          iconBg(color) {
            return { teal: 'bg-teal-50', indigo: 'bg-indigo-50', purple: 'bg-purple-50' }[color] || 'bg-gray-50';
          },
          iconText(color) {
            return { teal: 'text-teal-600', indigo: 'text-indigo-600', purple: 'text-purple-600' }[color] || 'text-gray-600';
          },
          checkColor(color) {
            return { teal: 'text-teal-500', indigo: 'text-indigo-500', purple: 'text-purple-500' }[color] || 'text-gray-500';
          },
          areaBg(i) {
            return ['bg-teal-100', 'bg-indigo-100', 'bg-purple-100'][i % 3];
          },
          areaText(i) {
            return ['text-teal-600', 'text-indigo-600', 'text-purple-600'][i % 3];
          }
        }"
        x-init="fetch('data/positions.json').then(r => r.json()).then(d => data = d)">

    <!-- Loading state -->
    <template x-if="!data">
      <div class="flex justify-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-teal-600"></div>
      </div>
    </template>

    <template x-if="data">
      <div>

        <!-- ==================== HEADLINE CARD ==================== -->
        <div class="mb-16" data-aos="fade-up">
          <!-- Hiring: gradient border with star icon -->
          <template x-if="data.isHiring">
            <div class="relative rounded-2xl bg-white p-1 shadow-lg" style="background: linear-gradient(135deg, #14B8A6, #6366F1);">
              <div class="rounded-xl bg-white p-8 sm:p-10">
                <div class="flex items-center gap-3 mb-4">
                  <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-teal-100">
                    <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                    </svg>
                  </span>
                  <h2 class="text-2xl sm:text-3xl font-bold text-gray-900" x-text="data.headline"></h2>
                </div>
                <p class="text-lg text-gray-600 leading-relaxed max-w-3xl" x-text="data.description"></p>
              </div>
            </div>
          </template>

          <!-- Not hiring: regular border, no star -->
          <template x-if="!data.isHiring">
            <div class="rounded-2xl bg-white p-8 sm:p-10 shadow-lg border border-gray-200">
              <div class="flex items-center gap-3 mb-4">
                <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-gray-100">
                  <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                </span>
                <h2 class="text-2xl sm:text-3xl font-bold text-gray-900" x-text="data.headline"></h2>
              </div>
              <p class="text-lg text-gray-600 leading-relaxed max-w-3xl" x-text="data.description"></p>
            </div>
          </template>
        </div>

        <!-- ==================== POSITION TYPE CARDS ==================== -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-20">
          <template x-for="(pos, idx) in data.positionTypes" :key="pos.title">
            <div class="bg-white rounded-xl p-8 shadow-sm card-hover border border-gray-100"
                 data-aos="fade-up" :data-aos-delay="idx * 100">

              <!-- Icon -->
              <div class="w-14 h-14 rounded-lg flex items-center justify-center mb-6"
                   :class="iconBg(pos.color)">

                <!-- academic-cap -->
                <template x-if="pos.icon === 'academic-cap'">
                  <svg class="w-7 h-7" :class="iconText(pos.color)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5"/>
                  </svg>
                </template>

                <!-- book -->
                <template x-if="pos.icon === 'book'">
                  <svg class="w-7 h-7" :class="iconText(pos.color)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
                  </svg>
                </template>

                <!-- globe -->
                <template x-if="pos.icon === 'globe'">
                  <svg class="w-7 h-7" :class="iconText(pos.color)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"/>
                  </svg>
                </template>
              </div>

              <h3 class="text-xl font-bold text-gray-900 mb-4" x-text="pos.title"></h3>

              <!-- Requirements list -->
              <ul class="space-y-3 text-gray-600">
                <template x-for="req in pos.requirements" :key="req">
                  <li class="flex items-start gap-2">
                    <svg class="w-5 h-5 mt-0.5 flex-shrink-0" :class="checkColor(pos.color)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <span x-text="req"></span>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </div>

        <!-- ==================== RESEARCH AREAS ==================== -->
        <section class="mb-20" data-aos="fade-up">
          <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-gray-900 mb-3">Available Research Areas</h2>
            <p class="text-gray-600 text-lg">Current project areas open for new team members</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <template x-for="(area, i) in data.researchAreas" :key="area">
              <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 card-hover"
                   data-aos="fade-up" :data-aos-delay="i * 100">
                <div class="inline-flex items-center justify-center w-10 h-10 rounded-full mb-4"
                     :class="areaBg(i)">
                  <!-- Research area icons cycling through the three types -->
                  <template x-if="i % 3 === 0">
                    <svg class="w-5 h-5" :class="areaText(i)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5M14.25 3.104c.251.023.501.05.75.082"/>
                    </svg>
                  </template>
                  <template x-if="i % 3 === 1">
                    <svg class="w-5 h-5" :class="areaText(i)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375"/>
                    </svg>
                  </template>
                  <template x-if="i % 3 === 2">
                    <svg class="w-5 h-5" :class="areaText(i)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"/>
                    </svg>
                  </template>
                </div>
                <h3 class="text-base font-semibold text-gray-900 mb-2"
                    x-text="area.match(/^(.+?)(?:\s+of\s|\s+for\s)/)?.[1] || area"></h3>
                <p class="text-sm text-gray-600 leading-relaxed" x-text="area"></p>
              </div>
            </template>
          </div>
        </section>

        <!-- ==================== HOW TO APPLY ==================== -->
        <section data-aos="fade-up">
          <div class="bg-gray-50 rounded-2xl p-8 sm:p-12 text-center border border-gray-100">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-teal-100 mb-6">
              <svg class="w-8 h-8 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
              </svg>
            </div>
            <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-4">How to Apply</h2>
            <p class="text-gray-600 text-lg mb-6 max-w-2xl mx-auto">
              Please send your CV, a brief statement of research interests, and contact information for references.
            </p>
            <a :href="'mailto:' + data.contactEmail"
               class="inline-flex items-center px-8 py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-lg transition-all duration-300 shadow-lg shadow-teal-600/25 hover:shadow-teal-700/30">
              <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
              <span x-text="data.contactEmail"></span>
            </a>
          </div>
        </section>

      </div>
    </template>

  </main>

  <!-- Footer injected by components.js -->
  <div id="footer-placeholder"></div>

  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
