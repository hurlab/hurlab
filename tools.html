<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z36JMZ1F1K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Z36JMZ1F1K');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools & Software - Hur Lab</title>
  <meta name="description" content="Bioinformatics tools and software developed by the Hur Lab">
  <meta property="og:title" content="Tools & Software - Hur Lab">
  <meta property="og:description" content="Bioinformatics tools and software developed by the Hur Lab">
  <meta property="og:type" content="website">
  <meta property="og:url" content="http://hurlab.med.und.edu/hurlab/tools.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body class="bg-surface font-sans text-gray-800 antialiased">

  <!-- Navigation injected by components.js -->

  <!-- ============ HERO BANNER ============ -->
  <section class="hero-pattern bg-hero-pattern py-16 text-center relative overflow-hidden">
    <!-- Decorative floating shapes -->
    <div class="absolute inset-0 opacity-10">
      <div class="absolute top-10 left-1/4 w-32 h-32 bg-teal-400 rounded-full blur-3xl animate-float"></div>
      <div class="absolute bottom-10 right-1/4 w-40 h-40 bg-indigo-400 rounded-full blur-3xl float-animation-delay"></div>
    </div>

    <div class="relative z-10 max-w-4xl mx-auto px-4">
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-4" data-aos="fade-down">
        Tools & Software
      </h1>
      <p class="text-lg md:text-xl text-teal-100/80 mb-6 max-w-2xl mx-auto" data-aos="fade-up" data-aos-delay="100">
        Open-source bioinformatics tools for the research community
      </p>
      <a href="https://github.com/hurlab" target="_blank" rel="noopener"
         class="inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 backdrop-blur-sm text-white text-sm font-medium px-5 py-2.5 rounded-full border border-white/20 transition-all duration-300"
         data-aos="fade-up" data-aos-delay="200">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        github.com/hurlab
      </a>
    </div>
  </section>

  <!-- ============ FILTER BAR + TOOLS GRID ============ -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12"
           x-data="{
             activeFilter: 'All',
             tools: [],
             categories: ['All', 'Knowledgebase', 'Web Tool', 'R Package', 'R Shiny', 'Python', 'Desktop'],
             get filteredTools() {
               if (this.activeFilter === 'All') return this.tools;
               return this.tools.filter(t => t.category === this.activeFilter);
             },
             categoryColor(cat) {
               const colors = {
                 'R Package': 'bg-emerald-100 text-emerald-700',
                 'Web Tool': 'bg-blue-100 text-blue-700',
                 'Python': 'bg-yellow-100 text-yellow-800',
                 'Desktop': 'bg-gray-100 text-gray-700',
                 'R Shiny': 'bg-emerald-100 text-emerald-700',
                'Knowledgebase': 'bg-purple-100 text-purple-700'
               };
               return colors[cat] || 'bg-gray-100 text-gray-600';
             },
             filterBtnClass(cat) {
               return this.activeFilter === cat
                 ? 'bg-teal-600 text-white shadow-lg shadow-teal-600/25'
                 : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200';
             }
           }"
           x-init="fetch('data/tools.json').then(r => r.json()).then(d => tools = d)">

    <!-- Filter Buttons -->
    <div class="flex flex-wrap justify-center gap-2 mb-10" data-aos="fade-up">
      <template x-for="cat in categories" :key="cat">
        <button x-on:click="activeFilter = cat"
                :class="filterBtnClass(cat)"
                class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-300">
          <span x-text="cat"></span>
        </button>
      </template>
    </div>

    <!-- Tools Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <template x-for="(tool, idx) in filteredTools" :key="tool.name">
        <div class="card-hover gradient-border bg-white rounded-xl shadow-sm overflow-hidden flex flex-col"
             data-aos="fade-up"
             :data-aos-delay="(idx % 3) * 100">

          <div class="p-6 flex-1 flex flex-col">
            <!-- Header row: name + status -->
            <div class="flex items-start justify-between mb-3">
              <h3 class="font-mono font-bold text-lg text-gray-900" x-text="tool.name"></h3>
              <!-- Status indicator -->
              <span class="flex items-center gap-1.5 text-xs font-medium shrink-0 ml-2"
                    :class="tool.status === 'active' ? 'text-green-600' : 'text-amber-600'">
                <span class="relative flex h-2 w-2">
                  <span class="absolute inline-flex h-full w-full rounded-full opacity-75 animate-ping"
                        :class="tool.status === 'active' ? 'bg-green-400' : 'bg-amber-400'"></span>
                  <span class="relative inline-flex h-2 w-2 rounded-full"
                        :class="tool.status === 'active' ? 'bg-green-500' : 'bg-amber-500'"></span>
                </span>
                <span x-text="tool.status === 'active' ? 'Active' : 'In Development'"></span>
              </span>
            </div>

            <!-- Category badge -->
            <div class="mb-3">
              <span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold"
                    :class="categoryColor(tool.category)"
                    x-text="tool.category"></span>
            </div>

            <!-- Description -->
            <p class="text-gray-600 text-sm leading-relaxed mb-4 flex-1" x-text="tool.description"></p>

            <!-- Meta info -->
            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-gray-400 mb-4">
              <span class="flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                <span x-text="tool.version"></span>
              </span>
              <span class="flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span x-text="tool.updated"></span>
              </span>
              <span class="flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                <span x-text="tool.language"></span>
              </span>
            </div>
          </div>

          <!-- Action buttons -->
          <div class="px-6 pb-5 flex items-center gap-2">
            <template x-if="tool.url">
              <a :href="tool.url" target="_blank" rel="noopener"
                 class="inline-flex items-center gap-1.5 px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium rounded-lg transition-colors duration-200 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                Launch
              </a>
            </template>
            <template x-if="tool.github">
              <a :href="tool.github" target="_blank" rel="noopener"
                 class="inline-flex items-center gap-1.5 px-4 py-2 bg-gray-800 hover:bg-gray-900 text-white text-sm font-medium rounded-lg transition-colors duration-200 shadow-sm">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                GitHub
              </a>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- Empty state when filter returns no results -->
    <div x-show="filteredTools.length === 0 && tools.length > 0" x-cloak
         class="text-center py-16 text-gray-400">
      <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      <p class="text-lg font-medium">No tools found in this category</p>
    </div>
  </section>

  <!-- Footer injected by components.js -->

  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
