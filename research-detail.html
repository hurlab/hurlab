<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Detail - Hur Lab</title>
  <meta name="description" content="Research area details - Hur Lab at University of North Dakota">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    function researchDetailData() {
      return {
        area: null,
        areaIndex: 0,
        publications: [],
        relatedPubs: [],
        loading: true,
        error: false,

        async init() {
          try {
            const params = new URLSearchParams(window.location.search);
            this.areaIndex = parseInt(params.get('area')) || 0;

            const [resRes, pubRes] = await Promise.all([
              fetch('data/research.json'),
              fetch('data/publications.json')
            ]);
            const researchData = await resRes.json();
            const pubData = await pubRes.json();

            if (this.areaIndex >= 0 && this.areaIndex < researchData.areas.length) {
              this.area = researchData.areas[this.areaIndex];
            } else {
              this.error = true;
              this.loading = false;
              return;
            }

            this.publications = pubData.peerReviewed || [];

            // Filter related publications by keywords
            if (this.area.details && this.area.details.keywords) {
              const keywords = this.area.details.keywords.map(k => k.toLowerCase());
              this.relatedPubs = this.publications
                .filter(pub => {
                  if (!pub.text) return false;
                  const text = pub.text.toLowerCase();
                  return keywords.some(kw => text.includes(kw));
                })
                .sort((a, b) => (b.year || 0) - (a.year || 0))
                .slice(0, 20);
            }

            // Update page title
            document.title = this.area.title + ' - Hur Lab';
          } catch (e) {
            console.error('Error loading research detail:', e);
            this.error = true;
          }

          this.loading = false;
          this.$nextTick(() => {
            if (typeof AOS !== 'undefined') {
              AOS.init({ duration: 700, easing: 'ease-out-cubic', once: true, offset: 50 });
            }
          });
        },

        highlightPI(text) {
          if (!text) return '';
          return text.replace(/(Hur\s*J\b|Hur\s*J$|Hur\s*JU?\b)/gi, '<strong class="text-teal-700">$1</strong>');
        },

        isRecent(year) {
          if (!year) return false;
          const currentYear = new Date().getFullYear();
          return (currentYear - parseInt(year)) <= 2;
        },

        heroBgClass() {
          if (!this.area) return 'from-gray-700 to-gray-900';
          return this.area.color === 'indigo'
            ? 'from-indigo-700 via-indigo-800 to-gray-900'
            : 'from-teal-700 via-teal-800 to-gray-900';
        },

        badgeColorClass() {
          if (!this.area) return 'bg-gray-100 text-gray-700';
          return this.area.color === 'indigo'
            ? 'bg-indigo-100 text-indigo-700'
            : 'bg-teal-100 text-teal-700';
        },

        toolBadgeClass() {
          if (!this.area) return 'bg-gray-100 text-gray-700 border-gray-200';
          return this.area.color === 'indigo'
            ? 'bg-indigo-50 text-indigo-700 border-indigo-200'
            : 'bg-teal-50 text-teal-700 border-teal-200';
        },

        iconSvg() {
          if (!this.area) return '';
          const icons = {
            dna: `<svg class="w-12 h-12" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M16 4C16 4 12 12 12 16C12 20 16 24 16 24C16 24 20 20 20 16C20 12 16 4 16 4Z" fill="currentColor" opacity="0.2"/>
              <path d="M32 4C32 4 28 12 28 16C28 20 32 24 32 24C32 24 36 20 36 16C36 12 32 4 32 4Z" fill="currentColor" opacity="0.2"/>
              <path d="M16 24C16 24 12 32 12 36C12 40 16 44 16 44C16 44 20 40 20 36C20 32 16 24 16 24Z" fill="currentColor" opacity="0.2"/>
              <path d="M32 24C32 24 28 32 28 36C28 40 32 44 32 44C32 44 36 40 36 36C36 32 32 24 32 24Z" fill="currentColor" opacity="0.2"/>
              <line x1="16" y1="10" x2="32" y2="14"/><line x1="16" y1="18" x2="32" y2="22"/>
              <line x1="16" y1="30" x2="32" y2="34"/><line x1="16" y1="38" x2="32" y2="42"/>
              <circle cx="16" cy="10" r="2" fill="currentColor"/><circle cx="32" cy="14" r="2" fill="currentColor"/>
              <circle cx="16" cy="18" r="2" fill="currentColor"/><circle cx="32" cy="22" r="2" fill="currentColor"/>
              <circle cx="16" cy="30" r="2" fill="currentColor"/><circle cx="32" cy="34" r="2" fill="currentColor"/>
              <circle cx="16" cy="38" r="2" fill="currentColor"/><circle cx="32" cy="42" r="2" fill="currentColor"/>
            </svg>`,
            database: `<svg class="w-12 h-12" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="8" y="6" width="14" height="10" rx="2" fill="currentColor" opacity="0.2"/>
              <rect x="26" y="6" width="14" height="10" rx="2" fill="currentColor" opacity="0.2"/>
              <rect x="8" y="32" width="14" height="10" rx="2" fill="currentColor" opacity="0.2"/>
              <rect x="26" y="32" width="14" height="10" rx="2" fill="currentColor" opacity="0.2"/>
              <circle cx="24" cy="24" r="5" fill="currentColor" opacity="0.3"/>
              <line x1="15" y1="16" x2="21" y2="21"/><line x1="33" y1="16" x2="27" y2="21"/>
              <line x1="15" y1="32" x2="21" y2="27"/><line x1="33" y1="32" x2="27" y2="27"/>
            </svg>`,
            chip: `<svg class="w-12 h-12" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="24" cy="24" r="14" fill="currentColor" opacity="0.1"/>
              <circle cx="24" cy="24" r="8" fill="currentColor" opacity="0.15"/>
              <circle cx="24" cy="18" r="2" fill="currentColor"/>
              <circle cx="20" cy="26" r="2" fill="currentColor"/>
              <circle cx="28" cy="26" r="2" fill="currentColor"/>
              <line x1="24" y1="18" x2="20" y2="26"/><line x1="24" y1="18" x2="28" y2="26"/>
              <line x1="20" y1="26" x2="28" y2="26"/>
              <line x1="24" y1="10" x2="24" y2="14"/><line x1="24" y1="34" x2="24" y2="38"/>
              <line x1="10" y1="24" x2="14" y2="24"/><line x1="34" y1="24" x2="38" y2="24"/>
              <line x1="14" y1="14" x2="17" y2="17"/><line x1="31" y1="31" x2="34" y2="34"/>
              <line x1="34" y1="14" x2="31" y2="17"/><line x1="17" y1="31" x2="14" y2="34"/>
            </svg>`,
            brain: `<svg class="w-12 h-12" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M24 6C16 6 10 12 10 20C10 26 13 30 16 32V38H32V32C35 30 38 26 38 20C38 12 32 6 24 6Z" fill="currentColor" opacity="0.15"/>
              <path d="M24 6C16 6 10 12 10 20C10 26 13 30 16 32V38H32V32C35 30 38 26 38 20C38 12 32 6 24 6Z"/>
              <line x1="18" y1="38" x2="18" y2="42"/><line x1="24" y1="38" x2="24" y2="44"/>
              <line x1="30" y1="38" x2="30" y2="42"/>
              <path d="M16 22C18 20 20 22 22 20C24 18 26 20 28 18C30 16 32 18 34 16" stroke-width="2.5"/>
              <circle cx="17" cy="18" r="1.5" fill="currentColor"/><circle cx="31" cy="18" r="1.5" fill="currentColor"/>
            </svg>`,
            shield: `<svg class="w-12 h-12" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M24 4L28 10L36 8L34 16L42 18L38 24L42 30L34 32L36 40L28 38L24 44L20 38L12 40L14 32L6 30L10 24L6 18L14 16L12 8L20 10Z" fill="currentColor" opacity="0.12"/>
              <path d="M24 4L28 10L36 8L34 16L42 18L38 24L42 30L34 32L36 40L28 38L24 44L20 38L12 40L14 32L6 30L10 24L6 18L14 16L12 8L20 10Z"/>
              <circle cx="24" cy="24" r="7" fill="currentColor" opacity="0.15"/>
              <circle cx="24" cy="21" r="1.5" fill="currentColor"/>
              <circle cx="21" cy="26" r="1.5" fill="currentColor"/>
              <circle cx="27" cy="26" r="1.5" fill="currentColor"/>
            </svg>`
          };
          return icons[this.area.icon] || icons['dna'];
        }
      };
    }
  </script>
</head>
<body class="bg-surface font-sans text-gray-800 antialiased">

  <!-- Navigation -->
  <div id="nav-placeholder"></div>

  <div x-data="researchDetailData()">

    <!-- Loading State -->
    <div x-show="loading" class="flex flex-col items-center justify-center py-40">
      <div class="w-12 h-12 border-4 border-teal-200 rounded-full animate-spin border-t-teal-600 mb-4"></div>
      <p class="text-gray-500 text-sm">Loading research details...</p>
    </div>

    <!-- Error State -->
    <div x-show="error && !loading" x-cloak class="py-40 text-center">
      <div class="max-w-md mx-auto px-6">
        <svg class="w-16 h-16 mx-auto mb-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
        </svg>
        <h2 class="text-2xl font-bold text-gray-700 mb-2">Research Area Not Found</h2>
        <p class="text-gray-500 mb-6">The requested research area could not be loaded.</p>
        <a href="research.html" class="inline-flex items-center px-5 py-2.5 bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold rounded-lg transition-colors">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Back to Research
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <template x-if="area && !loading">
      <div>

        <!-- Hero Banner -->
        <section class="bg-gradient-to-br pt-36 pb-16" :class="heroBgClass()">
          <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row items-start gap-6" data-aos="fade-up">
              <!-- Icon -->
              <div class="flex-shrink-0 w-24 h-24 rounded-2xl bg-white/10 backdrop-blur flex items-center justify-center text-white">
                <div x-html="iconSvg()"></div>
              </div>
              <!-- Title & Description -->
              <div>
                <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold text-white mb-4" x-text="area.title"></h1>
                <p class="text-lg md:text-xl text-white/80 leading-relaxed max-w-3xl" x-text="area.description"></p>
              </div>
            </div>
          </div>
        </section>

        <!-- Overview Section -->
        <section class="py-12 md:py-16 bg-white">
          <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8" data-aos="fade-up">
            <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6">Overview</h2>
            <template x-if="area.details && area.details.overview">
              <div class="prose prose-lg max-w-none">
                <template x-for="(para, i) in area.details.overview.split('\n\n')" :key="i">
                  <p class="text-gray-600 leading-relaxed mb-4" x-text="para"></p>
                </template>
              </div>
            </template>
          </div>
        </section>

        <!-- Key Topics -->
        <template x-if="area.details && area.details.keyTopics && area.details.keyTopics.length > 0">
          <section class="py-12 md:py-16 bg-gray-50">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8" data-aos="fade-up">
              <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-6">Key Topics</h2>
              <div class="flex flex-wrap gap-3">
                <template x-for="(topic, i) in area.details.keyTopics" :key="i">
                  <span class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium"
                        :class="badgeColorClass()"
                        x-text="topic"></span>
                </template>
              </div>
            </div>
          </section>
        </template>

        <!-- Tools & Collaborators Row -->
        <section class="py-12 md:py-16 bg-white">
          <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

              <!-- Related Tools -->
              <template x-if="area.details && area.details.tools && area.details.tools.length > 0">
                <div data-aos="fade-up">
                  <h2 class="text-xl font-bold text-gray-900 mb-4">
                    <svg class="w-5 h-5 inline-block mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    Related Tools
                  </h2>
                  <div class="flex flex-wrap gap-2">
                    <template x-for="(tool, i) in area.details.tools" :key="i">
                      <a href="tools.html"
                         class="inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-medium border transition-colors hover:shadow-sm"
                         :class="toolBadgeClass()">
                        <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                        </svg>
                        <span x-text="tool"></span>
                      </a>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Key Collaborators -->
              <template x-if="area.details && area.details.collaborators && area.details.collaborators.length > 0">
                <div data-aos="fade-up" data-aos-delay="100">
                  <h2 class="text-xl font-bold text-gray-900 mb-4">
                    <svg class="w-5 h-5 inline-block mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    Key Collaborators
                  </h2>
                  <ul class="space-y-2">
                    <template x-for="(collab, i) in area.details.collaborators" :key="i">
                      <li class="flex items-center text-gray-600">
                        <svg class="w-4 h-4 mr-2 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span x-text="collab"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>

            </div>
          </div>
        </section>

        <!-- Related Publications -->
        <template x-if="relatedPubs.length > 0">
          <section class="py-12 md:py-16 bg-gray-50">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between mb-8" data-aos="fade-up">
                <h2 class="text-2xl md:text-3xl font-bold text-gray-900">Related Publications</h2>
                <span class="text-sm text-gray-500 font-medium" x-text="relatedPubs.length + ' publications'"></span>
              </div>
              <div class="space-y-4">
                <template x-for="(pub, index) in relatedPubs" :key="'rp-' + index">
                  <div class="pub-card bg-white rounded-lg p-5 border border-gray-100 shadow-sm"
                       data-aos="fade-up" :data-aos-delay="Math.min(index * 30, 300)">
                    <div class="flex items-start justify-between gap-3 mb-2">
                      <span class="text-xs text-gray-400 font-mono shrink-0" x-text="'#' + pub.number"></span>
                      <div class="flex items-center gap-2 shrink-0">
                        <template x-if="isRecent(pub.year)">
                          <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-teal-100 text-teal-800">Recent</span>
                        </template>
                        <template x-if="pub.isPreprint">
                          <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">Preprint</span>
                        </template>
                      </div>
                    </div>
                    <p class="text-sm text-gray-700 leading-relaxed mb-3" x-html="highlightPI(pub.text)"></p>
                    <div class="flex flex-wrap items-center gap-2">
                      <template x-if="pub.pmid">
                        <a :href="'https://pubmed.ncbi.nlm.nih.gov/' + pub.pmid" target="_blank" rel="noopener noreferrer"
                           class="px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition-colors">
                          PMID: <span x-text="pub.pmid"></span>
                        </a>
                      </template>
                      <template x-if="pub.doi">
                        <a :href="pub.doi.startsWith('http') ? pub.doi : 'https://doi.org/' + pub.doi" target="_blank" rel="noopener noreferrer"
                           class="px-2.5 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700 hover:bg-green-200 transition-colors">
                          DOI
                        </a>
                      </template>
                      <template x-if="pub.year">
                        <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600" x-text="pub.year"></span>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </section>
        </template>

        <!-- Back to Research Button -->
        <section class="py-12 bg-white">
          <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <a href="research.html"
               class="inline-flex items-center px-6 py-3 bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold rounded-lg transition-colors shadow-lg shadow-teal-500/25">
              <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
              </svg>
              Back to Research
            </a>
          </div>
        </section>

      </div>
    </template>

  </div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
