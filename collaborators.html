<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z36JMZ1F1K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Z36JMZ1F1K');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Research collaborators of the Hur Lab spanning institutions worldwide">
  <meta property="og:title" content="Collaborators - Hur Lab">
  <meta property="og:description" content="Research collaborators of the Hur Lab spanning institutions worldwide">
  <meta property="og:type" content="website">
  <meta property="og:url" content="http://hurlab.med.und.edu/hurlab/collaborators.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Collaborators - Hur Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body class="bg-surface font-sans text-gray-800 antialiased">

  <!-- Navigation injected by components.js -->
  <div id="nav-placeholder"></div>

  <!-- ==================== HEADER BANNER ==================== -->
  <section class="bg-hero-pattern py-16 text-center">
    <div class="max-w-4xl mx-auto px-6" data-aos="fade-up">
      <h1 class="text-4xl sm:text-5xl font-bold text-white mb-4">Collaborators</h1>
      <p class="text-lg sm:text-xl text-teal-200/90 max-w-2xl mx-auto">
        Our research network spans institutions worldwide
      </p>
    </div>
  </section>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="max-w-5xl mx-auto px-6 sm:px-8 lg:px-12 py-16 lg:py-24 space-y-10"
        x-data="{
          data: { categories: [] },
          colorMap: {
            teal:   { border: 'border-teal-500',   bg: 'bg-teal-400',   text: 'text-teal-700',   iconBg: 'bg-teal-100',   iconText: 'text-teal-600'   },
            indigo: { border: 'border-indigo-500', bg: 'bg-indigo-400', text: 'text-indigo-700', iconBg: 'bg-indigo-100', iconText: 'text-indigo-600' },
            purple: { border: 'border-purple-500', bg: 'bg-purple-400', text: 'text-purple-700', iconBg: 'bg-purple-100', iconText: 'text-purple-600' },
            green:  { border: 'border-green-500',  bg: 'bg-green-400',  text: 'text-green-700',  iconBg: 'bg-green-100',  iconText: 'text-green-600'  }
          },
          icons: {
            dna: '<path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; stroke-width=&quot;1.5&quot; d=&quot;M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5&quot;/>',
            database: '<path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; stroke-width=&quot;1.5&quot; d=&quot;M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375&quot;/>',
            chip: '<path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; stroke-width=&quot;1.5&quot; d=&quot;M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 002.25-2.25V6.75a2.25 2.25 0 00-2.25-2.25H6.75A2.25 2.25 0 004.5 6.75v10.5a2.25 2.25 0 002.25 2.25z&quot;/>',
            flask: '<path stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; stroke-width=&quot;1.5&quot; d=&quot;M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5M14.25 3.104c.251.023.501.05.75.082M19 14.5l-2.47 2.47a2.25 2.25 0 01-1.59.659H9.06a2.25 2.25 0 01-1.591-.659L5 14.5m14 0V5.846a2.25 2.25 0 00-1.28-2.033&quot;/>'
          },
          async init() {
            try {
              const resp = await fetch('data/collaborators.json');
              this.data = await resp.json();
              this.$nextTick(() => AOS.refresh());
            } catch (e) {
              console.error('Failed to load collaborators data:', e);
              this.data = { categories: [] };
            }
          }
        }">

    <template x-for="(category, catIdx) in data.categories" :key="category.title">
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"
           data-aos="fade-up"
           :data-aos-delay="catIdx * 100">
        <div class="border-l-4 p-8" :class="colorMap[category.color].border">
          <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-3">
            <span class="inline-flex items-center justify-center w-9 h-9 rounded-full flex-shrink-0"
                  :class="colorMap[category.color].iconBg">
              <svg class="w-5 h-5" :class="colorMap[category.color].iconText" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                   x-html="icons[category.icon]"></svg>
            </span>
            <span x-text="category.title"></span>
          </h2>
          <ul class="space-y-4">
            <template x-for="(member, memIdx) in category.members" :key="member.name">
              <li class="flex items-start gap-3"
                  data-aos="fade-up"
                  :data-aos-delay="(memIdx + 1) * 50">
                <div class="w-1.5 h-1.5 rounded-full mt-2.5 flex-shrink-0"
                     :class="colorMap[category.color].bg"></div>
                <div>
                  <template x-if="member.url">
                    <a :href="member.url" target="_blank" rel="noopener noreferrer"
                       class="font-semibold hover:opacity-80 transition-colors"
                       :class="colorMap[category.color].text">
                      <span x-text="member.name"></span>
                      <svg class="inline w-3.5 h-3.5 ml-1 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                    </a>
                  </template>
                  <template x-if="!member.url">
                    <span class="text-gray-900 font-semibold" x-text="member.name"></span>
                  </template>
                  <p class="text-sm text-gray-500" x-text="member.institution"></p>
                </div>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </template>

  </main>

  <!-- Footer injected by components.js -->
  <div id="footer-placeholder"></div>

  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
