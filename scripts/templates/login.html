<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hur Lab Admin - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-teal-700 to-indigo-800 bg-clip-text text-transparent">
                    Hur Lab Admin
                </h1>
            </div>

            <!-- Error message -->
            <div id="errorMsg" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg"></div>

            <form id="loginForm" method="POST" action="/login" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition text-sm">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition text-sm">
                </div>
                <button type="submit"
                        class="w-full bg-gradient-to-r from-teal-600 to-indigo-700 hover:from-teal-700 hover:to-indigo-800 text-white font-medium py-2.5 rounded-lg transition">
                    Login
                </button>
            </form>
        </div>
    </div>

    <script>
        // Show error if redirected with ?error param
        const params = new URLSearchParams(window.location.search);
        if (params.has('error')) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.classList.remove('hidden');
            errorDiv.textContent = params.get('error') || 'Invalid credentials.';
        }
    </script>
</body>
</html>
