<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hur Lab Admin - Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-8">
            <div class="text-center mb-2">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-teal-700 to-indigo-800 bg-clip-text text-transparent">
                    Initial Setup
                </h1>
            </div>
            <p class="text-center text-sm text-gray-500 mb-8">Create your admin account</p>

            <!-- Error message -->
            <div id="errorMsg" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg"></div>

            <form id="setupForm" method="POST" action="/setup" class="space-y-5" onsubmit="return validateForm()">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition text-sm">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition text-sm">
                </div>
                <div>
                    <label for="confirm" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <input type="password" id="confirm" name="confirm" required autocomplete="new-password"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition text-sm">
                </div>
                <button type="submit"
                        class="w-full bg-gradient-to-r from-teal-600 to-indigo-700 hover:from-teal-700 hover:to-indigo-800 text-white font-medium py-2.5 rounded-lg transition">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <script>
        function validateForm() {
            const pw = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const errorDiv = document.getElementById('errorMsg');

            if (pw !== confirm) {
                errorDiv.classList.remove('hidden');
                errorDiv.textContent = 'Passwords do not match.';
                return false;
            }
            if (pw.length < 8) {
                errorDiv.classList.remove('hidden');
                errorDiv.textContent = 'Password must be at least 8 characters.';
                return false;
            }
            errorDiv.classList.add('hidden');
            return true;
        }

        // Show error if redirected with ?error param
        const params = new URLSearchParams(window.location.search);
        if (params.has('error')) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.classList.remove('hidden');
            errorDiv.textContent = params.get('error') || 'Setup failed.';
        }
    </script>
</body>
</html>
