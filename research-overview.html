  <meta property="og:title" content="Research at a Glance - Hur Lab">
  <meta property="og:description" content="Publications, research areas, career timeline and funded grants of the Hur Lab at the University of North Dakota">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hurlab.med.und.edu/hurlab/research-overview.html">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .gantt-bar { min-width: 4px; }
  </style>
  <script>
    // One color per research area, in data/research.json order
    const AREA_COLORS = ['#0d9488', '#4f46e5', '#9333ea', '#e11d48', '#d97706', '#0284c7', '#65a30d'];
    // Chart.js instances live outside Alpine: a reactive proxy around a chart breaks its redraws
    const CHARTS = {};

    function overview() {
      return {
        loading: true,
        error: false,
        pubs: [],
        areas: [],
        grants: { current: [], previous: [] },
        info: { researchInterests: [], eras: [], milestones: [], highlights: {} },
        cumulative: false,
        authorFilter: 'any',      // any | led | coauthor, for the research-area chart
        showTable: false,
        showLeadTable: false,

        async init() {
          try {
            const [p, g, o] = await Promise.all(
              ['data/publications.json', 'data/grants.json', 'data/overview.json'].map(u => fetch(u, { cache: 'no-cache' }).then(r => {
                if (!r.ok) throw new Error(u + ' ' + r.status);
                return r.json();
              })));
            this.pubs = p.peerReviewed || [];
            this.areas = p.areas || [];
            this.grants = g;
            this.info = o;
          } catch (e) {
            console.error('Failed to load overview data:', e);
            this.error = true;
          } finally {
            this.loading = false;
          }
          if (!this.error) this.$nextTick(() => { this.drawChart(); this.drawLeadChart(); AOS.refresh(); });
        },

        color(i) { return AREA_COLORS[i % AREA_COLORS.length]; },
        areaIndex(title) { return this.areas.indexOf(title); },

        // ---- stats
        get paperCount() {   // journal and conference papers (not preprints, books, or the book chapter)
          return this.pubs.filter(p => !['Preprint', 'Book', 'Book chapter'].includes(p.category)).length;
        },
        get ledCount() { return this.pubs.filter(p => this.isLed(p)).length; },
        isLed(p) { return p.authorship === 'first' || p.authorship === 'corresponding'; },
        passesAuthor(p) {
          if (this.authorFilter === 'led') return this.isLed(p);
          if (this.authorFilter === 'coauthor') return p.authorship === 'coauthor';
          return true;
        },
        get firstYear() { return Math.min(...this.pubs.map(p => p.year).filter(Boolean)); },
        get lastYear() { return Math.max(...this.pubs.map(p => p.year).filter(Boolean)); },
        get years() {
          const ys = [];
          for (let y = this.firstYear; y <= this.lastYear; y++) ys.push(y);
          return ys;
        },

        // ---- (a) publications per year by area
        series() {
          return this.areas.map((area, i) => {
            let run = 0;
            const data = this.years.map(y => {
              const n = this.pubs.filter(p => p.areaIndex === i && p.year === y && this.passesAuthor(p)).length;
              run += n;
              return this.cumulative ? run : n;
            });
            return { label: area, data, backgroundColor: this.color(i), borderWidth: 0, stack: 'pubs' };
          });
        },
        drawChart() {
          const el = document.getElementById('pubChart');
          if (!el || !window.Chart) return;
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (CHARTS.area) {
            CHARTS.area.data.datasets = this.series();
            CHARTS.area.options.scales.y.title.text = this.cumulative ? 'Total publications' : 'Publications';
            CHARTS.area.update();
            return;
          }
          CHARTS.area = new Chart(el, {
            type: 'bar',
            data: { labels: this.years, datasets: this.series() },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: reduce ? false : { duration: 500 },
              interaction: { mode: 'index', intersect: false },
              scales: {
                x: { stacked: true, grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true } },
                y: { stacked: true, beginAtZero: true, ticks: { precision: 0 },
                     title: { display: true, text: this.cumulative ? 'Total publications' : 'Publications' } }
              },
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true } },
                tooltip: {
                  filter: item => item.raw > 0,
                  callbacks: { footer: items => 'Total: ' + items.reduce((s, i) => s + i.raw, 0) }
                }
              }
            }
          });
        },
        setCumulative(v) {
          this.cumulative = v;
          this.drawChart();
        },
        setAuthorFilter(v) {
          this.authorFilter = v;
          this.drawChart();
        },
        tableRows() {
          const s = this.series();
          return this.years.map((y, j) => ({ year: y, counts: s.map(d => d.data[j]), total: s.reduce((t, d) => t + d.data[j], 0) }));
        },

        // ---- led by Dr. Hur vs co-authored (edited books left out); bottom to top
        LEAD_ROLES: [
          { key: 'coauthor', label: 'Co-authored', color: '#cbd5e1' },
          { key: 'corresponding', label: 'Corresponding author', color: '#4f46e5' },
          { key: 'first', label: 'First or co-first author', color: '#0d9488' }
        ],
        leadSeries() {
          return this.LEAD_ROLES.map(r => ({
            label: r.label, backgroundColor: r.color, borderWidth: 0, stack: 'lead',
            data: this.years.map(y => this.pubs.filter(p => p.year === y && p.authorship === r.key).length)
          }));
        },
        leadTotals() {
          return Object.fromEntries(this.LEAD_ROLES.map(r => [r.key, this.pubs.filter(p => p.authorship === r.key).length]));
        },
        drawLeadChart() {
          const el = document.getElementById('leadChart');
          if (!el || !window.Chart) return;
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (CHARTS.lead) CHARTS.lead.destroy();
          CHARTS.lead = new Chart(el, {
            type: 'bar',
            data: { labels: this.years, datasets: this.leadSeries() },
            options: {
              responsive: true, maintainAspectRatio: false,
              animation: reduce ? false : { duration: 500 },
              interaction: { mode: 'index', intersect: false },
              scales: {
                x: { stacked: true, grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true } },
                y: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: 'Publications' } }
              },
              plugins: {
                legend: { position: 'bottom', reverse: true, labels: { boxWidth: 12, usePointStyle: true } },
                tooltip: { reverse: true, filter: item => item.raw > 0,
                           callbacks: { footer: items => 'Total: ' + items.reduce((s, i) => s + i.raw, 0) } }
              }
            }
          });
        },
        leadTableRows() {
          const s = this.leadSeries();
          return this.years.map((y, j) => ({ year: y, counts: s.map(d => d.data[j]) }));
        },

        // ---- (b) career timeline
        eraEnd(era) { return era.end ? era.end.slice(0, 4) : 'present'; },
        eraWidth(era) {
          const span = this.lastYear + 1 - this.firstYear;
          return Math.max(((era.pubYears[1] - era.pubYears[0] + 1) / span) * 100, 6) + '%';
        },

        // ---- (c) area cards
        areaPubs(i) { return this.pubs.filter(p => p.areaIndex === i); },
        areaYears(i) {
          const ys = this.areaPubs(i).map(p => p.year).filter(Boolean);
          return ys.length ? Math.min(...ys) + '-' + Math.max(...ys) : '';
        },
        highlights(area) {
          const nums = (this.info.highlights || {})[area] || [];
          return nums.map(n => this.pubs.find(p => String(p.number) === String(n))).filter(Boolean);
        },
        bestLink(p) { return p.links.pubmed || p.links.doi || p.links.pmc || null; },

        // ---- (d) grants gantt
        ym(s) { const [y, m] = s.split('-').map(Number); return y + (m - 1) / 12; },
        get ganttRange() {
          const all = [...this.grants.current, ...this.grants.previous].filter(g => g.start && g.end);
          const lo = Math.floor(Math.min(...all.map(g => this.ym(g.start))));
          const hi = Math.ceil(Math.max(...all.map(g => this.ym(g.end)) , new Date().getFullYear() + 1));
          return [lo, hi];
        },
        ganttTicks() {
          const [lo, hi] = this.ganttRange, ticks = [];
          const step = (hi - lo) > 12 ? 2 : 1;
          for (let y = lo; y <= hi; y += step) ticks.push({ year: y, left: ((y - lo) / (hi - lo)) * 100 + '%' });
          return ticks;
        },
        todayLeft() {
          const [lo, hi] = this.ganttRange, d = new Date();
          return ((d.getFullYear() + d.getMonth() / 12 - lo) / (hi - lo)) * 100 + '%';
        },
        ganttRows() {
          const rows = [...this.grants.current, ...this.grants.previous]
            .filter(g => g.start && g.end)
            .sort((a, b) => b.start.localeCompare(a.start));
          const [lo, hi] = this.ganttRange;
          return rows.map(g => ({
            ...g,
            left: ((this.ym(g.start) - lo) / (hi - lo)) * 100 + '%',
            width: ((this.ym(g.end) + 1 / 12 - this.ym(g.start)) / (hi - lo)) * 100 + '%',
            years: g.start.slice(0, 4) + '-' + g.end.slice(0, 4)
          }));
        },
        barColor(g) {
          if (g.status === 'active') return 'bg-primary-600';
          return g.type === 'internal' ? 'bg-amber-400' : 'bg-slate-500';
        },
        statusLabel(g) {
          if (g.status === 'active') return 'Active';
          return g.type === 'internal' ? 'Completed, UND internal' : 'Completed';
        },
        grantCount(status, type) {
          const list = status === 'active' ? this.grants.current : this.grants.previous;
          return list.filter(g => !type || g.type === type).length;
        }
      };
    }
  </script>
</head>
<body class="bg-surface font-sans text-gray-800 antialiased">

  <div id="nav-placeholder"></div>

  <main x-data="overview()">

    <!-- Hero -->
    <section class="bg-hero-pattern py-6 text-center">
      <div class="max-w-6xl mx-auto px-4" data-aos="fade-up">
        <h1 class="text-2xl md:text-3xl font-bold text-white">Research at a Glance</h1>
        <p class="text-sm md:text-base text-primary-200 mt-1">Publications, research areas, career path and funding of the Hur Lab</p>
        <ul class="flex flex-wrap justify-center gap-2 mt-3" x-show="info.researchInterests.length" x-cloak aria-label="Research interests">
          <template x-for="(r, i) in info.researchInterests" :key="i">
            <li class="px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-white border border-white/20" x-text="r"></li>
          </template>
        </ul>
      </div>
    </section>

    <div x-show="loading" class="py-20 text-center text-gray-500">Loading…</div>
    <div x-show="error" x-cloak class="py-20 text-center text-gray-500">Unable to load the overview data. Please try again later.</div>

    <template x-if="!loading && !error">
      <div>

        <!-- Stats -->
        <section class="bg-white border-b border-gray-100">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-5 grid grid-cols-2 md:grid-cols-5 gap-4 text-center">
            <div><div class="text-3xl font-bold text-gray-900" x-text="pubs.length"></div><div class="text-xs uppercase tracking-wide text-gray-500 mt-1">Publications in total</div></div>
            <div><div class="text-3xl font-bold text-gray-900" x-text="paperCount"></div><div class="text-xs uppercase tracking-wide text-gray-500 mt-1">Journal &amp; conference papers</div></div>
            <div><div class="text-3xl font-bold text-gray-900" x-text="ledCount"></div><div class="text-xs uppercase tracking-wide text-gray-500 mt-1">Led by Dr. Hur</div></div>
            <div><div class="text-3xl font-bold text-gray-900" x-text="firstYear + '-' + lastYear"></div><div class="text-xs uppercase tracking-wide text-gray-500 mt-1">Publishing since</div></div>
            <div class="col-span-2 md:col-span-1"><div class="text-3xl font-bold text-gray-900" x-text="grants.current.length"></div><div class="text-xs uppercase tracking-wide text-gray-500 mt-1">Active grants</div></div>
          </div>
          <p class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pb-4 -mt-1 text-xs text-gray-500 text-center">
            Totals include preprints, books and a book chapter. Journal &amp; conference papers are original articles, reviews, editorials,
            group authorship and conference proceedings. "Led" means first or co-first author, or corresponding author.
          </p>
        </section>

        <!-- (a) Publications per year -->
        <section class="py-8 bg-surface" aria-labelledby="pubs-heading">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-4">
              <div>
                <h2 id="pubs-heading" class="text-2xl font-bold text-gray-900">Publications per year</h2>
                <p class="text-sm text-gray-600">All publication types, colored by primary research area. The authorship buttons narrow the chart to papers led by Dr. Hur or to co-authored papers.</p>
              </div>
              <div class="flex flex-wrap gap-2">
              <div class="inline-flex rounded-lg border border-gray-300 overflow-hidden text-sm" role="group" aria-label="Authorship">
                <template x-for="opt in [['any', 'Any authorship'], ['led', 'Led by Dr. Hur'], ['coauthor', 'Co-authored']]" :key="opt[0]">
                  <button type="button" @click="setAuthorFilter(opt[0])" :aria-pressed="authorFilter === opt[0]"
                          :class="authorFilter === opt[0] ? 'bg-accent-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'"
                          class="px-3 py-1.5 border-l first:border-l-0 border-gray-300" x-text="opt[1]"></button>
                </template>
              </div>
              <div class="inline-flex rounded-lg border border-gray-300 overflow-hidden text-sm" role="group" aria-label="Chart mode">
                <button type="button" @click="setCumulative(false)" :aria-pressed="!cumulative"
                        :class="!cumulative ? 'bg-primary-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'" class="px-3 py-1.5">Per year</button>
                <button type="button" @click="setCumulative(true)" :aria-pressed="cumulative"
                        :class="cumulative ? 'bg-primary-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'" class="px-3 py-1.5 border-l border-gray-300">Cumulative</button>
              </div>
              </div>
            </div>
            <div class="bg-white rounded-xl border border-gray-200 p-3 sm:p-5">
              <div class="relative h-80 sm:h-96">
                <canvas id="pubChart" role="img"
                        :aria-label="(cumulative ? 'Cumulative publications' : 'Publications per year') + ' from ' + firstYear + ' to ' + lastYear + ', stacked by research area. A table version follows.'"></canvas>
              </div>
              <button type="button" @click="showTable = !showTable" :aria-expanded="showTable"
                      class="mt-3 text-sm text-primary-700 hover:underline" x-text="showTable ? 'Hide data table' : 'Show data table'"></button>
              <div x-show="showTable" x-cloak class="mt-3 overflow-x-auto">
                <table class="min-w-full text-xs">
                  <thead>
                    <tr class="border-b border-gray-200 text-left">
                      <th class="py-1 pr-3">Year</th>
                      <template x-for="(a, i) in areas" :key="i"><th class="py-1 pr-3 font-medium" x-text="a"></th></template>
                      <th class="py-1 pr-3">Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="row in tableRows()" :key="row.year">
                      <tr class="border-b border-gray-100">
                        <td class="py-1 pr-3 font-medium" x-text="row.year"></td>
                        <template x-for="(c, i) in row.counts" :key="i"><td class="py-1 pr-3" x-text="c"></td></template>
                        <td class="py-1 pr-3 font-semibold" x-text="row.total"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>

        <!-- Led by Dr. Hur vs co-authored -->
        <section class="py-8 bg-white" aria-labelledby="lead-heading">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 id="lead-heading" class="text-2xl font-bold text-gray-900">Led by Dr. Hur or co-authored</h2>
            <p class="text-sm text-gray-600 mb-4">
              From the author marks in the CV (* equal contribution, $ corresponding author). Not counted: the two edited books and one group-authorship paper that does not name Dr. Hur in the byline.
              <span class="whitespace-nowrap">First or co-first: <strong x-text="leadTotals().first"></strong></span> ·
              <span class="whitespace-nowrap">corresponding: <strong x-text="leadTotals().corresponding"></strong></span> ·
              <span class="whitespace-nowrap">co-authored: <strong x-text="leadTotals().coauthor"></strong></span>
            </p>
            <div class="bg-surface rounded-xl border border-gray-200 p-3 sm:p-5">
              <div class="relative h-72 sm:h-80">
                <canvas id="leadChart" role="img"
                        :aria-label="'Publications per year from ' + firstYear + ' to ' + lastYear + ', stacked by role: co-authored, corresponding author, first or co-first author. A table version follows.'"></canvas>
              </div>
              <button type="button" @click="showLeadTable = !showLeadTable" :aria-expanded="showLeadTable"
                      class="mt-3 text-sm text-primary-700 hover:underline" x-text="showLeadTable ? 'Hide data table' : 'Show data table'"></button>
              <div x-show="showLeadTable" x-cloak class="mt-3 overflow-x-auto">
                <table class="min-w-full text-xs">
                  <thead>
                    <tr class="border-b border-gray-200 text-left">
                      <th class="py-1 pr-3">Year</th>
                      <template x-for="r in LEAD_ROLES" :key="r.key"><th class="py-1 pr-3 font-medium" x-text="r.label"></th></template>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="row in leadTableRows()" :key="row.year">
                      <tr class="border-b border-gray-100">
                        <td class="py-1 pr-3 font-medium" x-text="row.year"></td>
                        <template x-for="(c, i) in row.counts" :key="i"><td class="py-1 pr-3" x-text="c"></td></template>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>

        <!-- (b) Career timeline -->
        <section class="py-8 bg-surface" aria-labelledby="timeline-heading">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 id="timeline-heading" class="text-2xl font-bold text-gray-900">How the research has grown</h2>
            <p class="text-sm text-gray-600 mb-5">Career stages from the CV, with the leading research areas of the papers published in each stage.</p>

            <!-- Proportional band (wide screens) -->
            <div class="hidden md:flex w-full rounded-lg overflow-hidden border border-gray-200 mb-4" aria-hidden="true">
              <template x-for="(era, i) in info.eras" :key="i">
                <div class="py-2 px-2 text-xs font-semibold text-white truncate"
                     :style="'width:' + eraWidth(era) + ';background:' + (era.themes.length ? color(areaIndex(era.themes[0])) : '#6b7280')"
                     x-text="era.pubYears[0] + '-' + era.pubYears[1]"></div>
              </template>
            </div>

            <ol class="grid gap-4 md:grid-cols-5">
              <template x-for="(era, i) in info.eras" :key="i">
                <li class="relative rounded-xl border border-gray-200 bg-white p-4">
                  <p class="text-xs font-mono text-gray-500" x-text="era.start.slice(0,4) + '-' + eraEnd(era)"></p>
                  <h3 class="font-semibold text-gray-900 leading-snug mt-0.5" x-text="era.label"></h3>
                  <p class="text-sm text-gray-600 mt-1"><span class="font-semibold" x-text="era.publications"></span> publications</p>
                  <ul class="mt-2 space-y-1">
                    <template x-for="t in era.themes" :key="t">
                      <li class="flex items-start gap-2 text-xs text-gray-700">
                        <span class="mt-1 h-2 w-2 rounded-full shrink-0" :style="'background:' + color(areaIndex(t))"></span>
                        <span x-text="t + ' (' + era.areaCounts[t] + ')'"></span>
                      </li>
                    </template>
                  </ul>
                </li>
              </template>
            </ol>

            <div class="mt-5" x-show="info.milestones.length">
              <h3 class="text-sm font-semibold text-gray-700 mb-2">Other appointments and roles</h3>
              <ul class="flex flex-wrap gap-2">
                <template x-for="(m, i) in info.milestones" :key="i">
                  <li class="text-xs px-3 py-1 rounded-full bg-gray-100 text-gray-700">
                    <span class="font-mono" x-text="m.start.slice(0,4) + (m.end ? '-' + m.end.slice(0,4) : '-')"></span>
                    <span x-text="m.what"></span>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </section>

        <!-- (c) Research area cards -->
        <section class="py-8 bg-white" aria-labelledby="areas-heading">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <h2 id="areas-heading" class="text-2xl font-bold text-gray-900 mb-5">Research areas</h2>
            <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
              <template x-for="(area, i) in areas" :key="i">
                <article class="bg-white rounded-xl border border-gray-200 overflow-hidden flex flex-col">
                  <div class="h-1.5" :style="'background:' + color(i)"></div>
                  <div class="p-5 flex flex-col flex-1">
                    <h3 class="font-bold text-gray-900 leading-snug" x-text="area"></h3>
                    <p class="text-sm text-gray-600 mt-1">
                      <span class="font-semibold" x-text="areaPubs(i).length"></span> publications
                      <span class="text-gray-400 mx-1" aria-hidden="true">|</span>
                      <span x-text="areaYears(i)"></span>
                    </p>
                    <h4 class="text-xs uppercase tracking-wide text-gray-500 mt-4 mb-2">Highlights</h4>
                    <ul class="space-y-2 flex-1">
                      <template x-for="p in highlights(area)" :key="p.number">
                        <li class="text-sm leading-snug">
                          <template x-if="bestLink(p)">
                            <a :href="bestLink(p)" target="_blank" rel="noopener" class="text-gray-900 hover:text-primary-700 hover:underline" x-text="p.title"></a>
                          </template>
                          <template x-if="!bestLink(p)"><span class="text-gray-900" x-text="p.title"></span></template>
                          <span class="block text-xs text-gray-500 italic" x-text="[p.journal, p.year].filter(Boolean).join(', ')"></span>
                        </li>
                      </template>
                    </ul>
                    <div class="mt-4 flex flex-wrap gap-x-4 gap-y-1 text-sm font-semibold">
                      <a :href="'research-detail.html?area=' + i" class="text-primary-700 hover:underline">About this area</a>
                      <a :href="'publications.html?area=' + i" class="text-primary-700 hover:underline">All papers</a>
                    </div>
                  </div>
                </article>
              </template>
            </div>
          </div>
        </section>

        <!-- (d) Funded grants timeline -->
        <section class="py-8 bg-surface" aria-labelledby="grants-heading">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-4">
              <div>
                <h2 id="grants-heading" class="text-2xl font-bold text-gray-900">Funded grants</h2>
                <p class="text-sm text-gray-600">Awarded grants only, newest first. Role shown for Dr. Hur.</p>
              </div>
              <div class="flex flex-wrap items-center gap-4 text-xs text-gray-600">
                <span class="flex items-center gap-1.5"><span class="h-3 w-5 rounded bg-primary-600"></span><span>Active (<span x-text="grantCount('active')"></span>)</span></span>
                <span class="flex items-center gap-1.5"><span class="h-3 w-5 rounded bg-slate-500"></span><span>Completed external (<span x-text="grantCount('completed', 'external')"></span>)</span></span>
                <span class="flex items-center gap-1.5"><span class="h-3 w-5 rounded bg-amber-400"></span><span>Completed UND internal pilot (<span x-text="grantCount('completed', 'internal')"></span>)</span></span>
              </div>
            </div>

            <div class="rounded-xl border border-gray-200 overflow-hidden bg-white">
              <!-- axis -->
              <div class="hidden md:grid grid-cols-[minmax(0,3fr)_minmax(0,2fr)] bg-gray-50 border-b border-gray-200 text-xs text-gray-500">
                <div class="px-4 py-2">Grant <span class="text-gray-400">(click a row for the award number)</span></div>
                <div class="relative h-8">
                  <template x-for="t in ganttTicks()" :key="t.year">
                    <span class="absolute top-2 -translate-x-1/2 font-mono" :style="'left:' + t.left" x-text="t.year"></span>
                  </template>
                </div>
              </div>
              <ul class="divide-y divide-gray-100">
                <template x-for="(g, i) in ganttRows()" :key="g.funder + g.start">
                  <!-- Active grants get a light tint; the award number and details open on click -->
                  <li x-data="{ open: false }" :class="g.status === 'active' ? 'bg-primary-50/70' : ''">
                    <div class="md:grid grid-cols-[minmax(0,3fr)_minmax(0,2fr)] items-center cursor-pointer" @click="open = !open">
                      <div class="px-3 pt-2 md:py-2 flex items-start gap-1.5">
                        <button type="button" class="mt-0.5 p-0.5 rounded text-gray-400 hover:text-gray-700 shrink-0"
                                :aria-expanded="open" :aria-label="(open ? 'Hide' : 'Show') + ' details for ' + g.title" @click.stop="open = !open">
                          <svg class="w-3.5 h-3.5 transition-transform" :class="open && 'rotate-90'" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                        </button>
                        <div class="min-w-0">
                          <p class="text-sm font-medium text-gray-900 leading-snug">
                            <template x-if="g.url"><a :href="g.url" target="_blank" rel="noopener" @click.stop class="hover:text-primary-700 hover:underline" x-text="g.title"></a></template>
                            <template x-if="!g.url"><span x-text="g.title"></span></template>
                          </p>
                          <p class="text-xs text-gray-500">
                            <span x-text="g.agency || g.funder"></span> · <span x-text="g.role"></span> · <span class="font-mono" x-text="g.years"></span>
                            <span class="ml-1 font-semibold" :class="g.status === 'active' ? 'text-primary-700' : 'text-gray-500'" x-text="statusLabel(g)"></span>
                          </p>
                        </div>
                      </div>
                      <div class="relative h-5 mx-4 mb-2 md:mb-0 md:mx-0 md:mr-4 bg-gray-50 md:bg-transparent rounded" aria-hidden="true">
                        <div class="absolute top-0 bottom-0 border-l border-dashed border-rose-400" :style="'left:' + todayLeft()"></div>
                        <div class="gantt-bar absolute top-1 bottom-1 rounded"
                             :class="barColor(g)"
                             :style="'left:' + g.left + ';width:' + g.width"></div>
                      </div>
                    </div>
                    <div x-show="open" x-cloak class="pl-9 pr-4 pb-2.5 text-xs text-gray-600 space-y-0.5">
                      <p x-show="g.award">Award number: <span class="font-mono" x-text="g.award"></span></p>
                      <p x-show="g.pis">PIs: <span x-text="g.pis"></span></p>
                      <p x-show="g.note" class="italic" x-text="g.note"></p>
                      <p x-show="g.url"><a :href="g.url" target="_blank" rel="noopener" class="text-primary-700 hover:underline" x-text="'Open ' + (g.linkLabel || 'link')"></a></p>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
            <p class="text-xs text-gray-500 mt-2">Dashed line: today.</p>
          </div>
        </section>

        <!-- Link to the full list -->
        <section class="py-8 bg-surface text-center">
          <a href="publications.html"
             class="inline-flex items-center px-8 py-3 bg-gray-900 hover:bg-gray-800 text-white font-semibold rounded-lg transition-colors">
            Search all publications
          </a>
        </section>

      </div>
    </template>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
