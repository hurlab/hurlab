  <style>
    [x-cloak] { display: none !important; }
    .gantt-bar { min-width: 4px; }
    section[id] { scroll-margin-top: 120px; }
    /* Section navigator: a sticky strip under the site menu; a left column on wide screens */
    #sectionnav { position: sticky; top: 64px; z-index: 40; background: rgba(255,255,255,.96); border-bottom: 1px solid #e5e7eb; }
    #sectionnav .sn-inner { display: flex; gap: 4px; overflow-x: auto; max-width: 72rem; margin: 0 auto; padding: 6px 16px; scrollbar-width: none; }
    #sectionnav .sn-title { display: none; }
    #sectionnav a { white-space: nowrap; font-size: 13px; padding: 4px 10px; border-radius: 9999px; color: #4b5563; }
    #sectionnav a:hover { color: #0f766e; }
    #sectionnav a.on { background: #0d9488; color: #fff; }
    @media (min-width: 1536px) {
      #sectionnav { position: fixed; top: 88px; left: 16px; width: 172px; background: rgba(255,255,255,.97); border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 4px 16px rgba(15,23,42,.08); }
      #sectionnav .sn-inner { flex-direction: column; padding: 10px 8px 10px 4px; margin: 0; overflow: visible; gap: 0; }
      #sectionnav .sn-title { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6b7280; margin: 0 0 6px 12px; }
      #sectionnav a { border-radius: 0; border-left: 2px solid #e5e7eb; padding: 4px 12px; }
      #sectionnav a.on { background: transparent; color: #0f766e; border-left-color: #0d9488; font-weight: 600; }
    }
    @media print { #sectionnav, #nav-placeholder { display: none; } }
    /* Citation figures on the research-area cards */
    .gauge { height: 4px; border-radius: 2px; background: #e5e7eb; margin-top: 4px; position: relative; overflow: hidden; }
    .gauge i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
    .gauge em { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #111827; opacity: .5; }
    /* Co-author network */
    #network [aria-pressed="true"] { background: #0d9488; color: #fff; }
    .dual-track { position: relative; width: 240px; height: 22px; }
    .dual-track::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: #e5e7eb; }
    .dual-fill { position: absolute; top: 9px; height: 4px; border-radius: 2px; background: #0d9488; }
    .dual-track input[type=range] { position: absolute; left: 0; top: 0; width: 100%; height: 22px; margin: 0; -webkit-appearance: none; appearance: none; background: none; pointer-events: none; }
    .dual-track input[type=range]::-webkit-slider-runnable-track { height: 22px; background: transparent; }
    .dual-track input[type=range]::-moz-range-track { height: 22px; background: transparent; }
    .dual-track input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; pointer-events: auto; width: 16px; height: 16px; margin-top: 3px; border-radius: 50%; background: #fff; border: 2px solid #0d9488; box-shadow: 0 1px 3px rgba(0,0,0,.25); cursor: grab; }
    .dual-track input[type=range]::-moz-range-thumb { pointer-events: auto; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #0d9488; cursor: grab; }
    .net-box svg { display: block; width: 100%; height: auto; min-width: 640px; }
    svg.net line { stroke: #111827; stroke-opacity: .14; }
    svg.net line.sep { stroke-opacity: .3; }
    svg.net circle { stroke: #fff; stroke-width: 1.5; cursor: pointer; }
    svg.net circle.hit { stroke: none; }
    svg.net circle.ring { stroke: #fff; stroke-width: 1; }
    svg.net path { stroke: #fff; stroke-width: .6; cursor: pointer; }
    svg.net text { font-family: Inter, system-ui, sans-serif; font-size: 11px; fill: #111827; pointer-events: none; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
    svg.net text.pi-label { fill: #111; font-weight: 700; font-size: 10.5px; stroke: none; }
    svg.net text.sep-label { font-size: 10.5px; fill: #6b7280; }
    svg.net tspan.cnt { fill: #6b7280; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; }
    svg.net g.n.dim path, svg.net g.n.dim circle.v { opacity: .18; }
    svg.net g.n.dim text { opacity: .15; }
    svg.net line.dim { stroke-opacity: .03; }
    svg.net line.hi { stroke-opacity: .6; stroke: #0d9488; }
    .net-tip { position: absolute; pointer-events: none; background: #111827; color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; line-height: 1.4; max-width: 260px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  </style>
  <script>
    // One color per research area, in data/research.json order
    const AREA_COLORS = ['#0d9488', '#4f46e5', '#9333ea', '#e11d48', '#d97706', '#0284c7', '#65a30d'];
    // Chart.js instances live outside Alpine: a reactive proxy around a chart breaks its redraws
    const CHARTS = {};

    function overview() {
      return {
        loading: true,
        error: false,
        pubs: [],
        areas: [],
        grants: { current: [], previous: [] },
        info: { researchInterests: [], eras: [], milestones: [], highlights: {} },
        honors: [],
        toolCount: 0,
        coauthors: {},
        metrics: {},     // pmid -> {c: citations, rcr, pct: NIH percentile, cpy} from NIH iCite
        metricsDate: '',
        cumulative: false,
        authorFilter: 'any',      // any | led | coauthor, for the research-area chart
        showTable: false,
        showLeadTable: false,

        async init() {
          try {
            const [p, g, o] = await Promise.all(
              ['data/publications.json', 'data/grants.json', 'data/overview.json'].map(u => fetch(u, { cache: 'no-cache' }).then(r => {
                if (!r.ok) throw new Error(u + ' ' + r.status);
                return r.json();
              })));
            this.pubs = p.peerReviewed || [];
            this.areas = p.areas || [];
            this.grants = g;
            this.info = o;
            // Optional files: the page works without them (sections hide themselves)
            const optional = u => fetch(u, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
            const [h, c, m, t] = await Promise.all(['data/honors.json', 'data/coauthors.json', 'data/metrics.json', 'data/tools.json'].map(optional));
            this.toolCount = t ? (Array.isArray(t) ? t : (t.tools || [])).length : 0;
            this.honors = h || [];
            this.coauthors = c || {};
            this.metrics = (m && m.by_pmid) || {};
            this.metricsDate = (m && m.retrieved) || '';
          } catch (e) {
            console.error('Failed to load overview data:', e);
            this.error = true;
          } finally {
            this.loading = false;
          }
          if (!this.error) this.$nextTick(() => {
            this.drawChart(); this.drawLeadChart(); this.mountNetwork(); this.mountSectionNav(); AOS.refresh();
          });
        },

        color(i) { return AREA_COLORS[i % AREA_COLORS.length]; },
        areaIndex(title) { return this.areas.indexOf(title); },

        // ---- stats
        get paperCount() {   // journal and conference papers (not preprints, books, or the book chapter)
          return this.pubs.filter(p => !['Preprint', 'Book', 'Book chapter'].includes(p.category)).length;
        },
        get ledCount() { return this.pubs.filter(p => this.isLed(p)).length; },
        isLed(p) { return p.authorship === 'first' || p.authorship === 'corresponding'; },
        passesAuthor(p) {
          if (this.authorFilter === 'led') return this.isLed(p);
          if (this.authorFilter === 'coauthor') return p.authorship === 'coauthor';
          return true;
        },
        get firstYear() { return Math.min(...this.pubs.map(p => p.year).filter(Boolean)); },
        get lastYear() { return Math.max(...this.pubs.map(p => p.year).filter(Boolean)); },
        get years() {
          const ys = [];
          for (let y = this.firstYear; y <= this.lastYear; y++) ys.push(y);
          return ys;
        },

        // ---- (a) publications per year by area
        series() {
          return this.areas.map((area, i) => {
            let run = 0;
            const data = this.years.map(y => {
              const n = this.pubs.filter(p => p.areaIndex === i && p.year === y && this.passesAuthor(p)).length;
              run += n;
              return this.cumulative ? run : n;
            });
            return { label: area, data, backgroundColor: this.color(i), borderWidth: 0, stack: 'pubs' };
          });
        },
        drawChart() {
          const el = document.getElementById('pubChart');
          if (!el || !window.Chart) return;
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (CHARTS.area) {
            CHARTS.area.data.datasets = this.series();
            CHARTS.area.options.scales.y.title.text = this.cumulative ? 'Total publications' : 'Publications';
            CHARTS.area.update();
            return;
          }
          CHARTS.area = new Chart(el, {
            type: 'bar',
            data: { labels: this.years, datasets: this.series() },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              animation: reduce ? false : { duration: 500 },
              interaction: { mode: 'index', intersect: false },
              scales: {
                x: { stacked: true, grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true } },
                y: { stacked: true, beginAtZero: true, ticks: { precision: 0 },
                     title: { display: true, text: this.cumulative ? 'Total publications' : 'Publications' } }
              },
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true } },
                tooltip: {
                  filter: item => item.raw > 0,
                  callbacks: { footer: items => 'Total: ' + items.reduce((s, i) => s + i.raw, 0) }
                }
              }
            }
          });
        },
        setCumulative(v) {
          this.cumulative = v;
          this.drawChart();
        },
        setAuthorFilter(v) {
          this.authorFilter = v;
          this.drawChart();
        },
        tableRows() {
          const s = this.series();
          return this.years.map((y, j) => ({ year: y, counts: s.map(d => d.data[j]), total: s.reduce((t, d) => t + d.data[j], 0) }));
        },

        // ---- led by Dr. Hur vs co-authored (edited books left out); bottom to top
        LEAD_ROLES: [
          { key: 'coauthor', label: 'Co-authored', color: '#cbd5e1' },
          { key: 'corresponding', label: 'Corresponding author', color: '#4f46e5' },
          { key: 'first', label: 'First or co-first author', color: '#0d9488' }
        ],
        leadSeries() {
          return this.LEAD_ROLES.map(r => ({
            label: r.label, backgroundColor: r.color, borderWidth: 0, stack: 'lead',
            data: this.years.map(y => this.pubs.filter(p => p.year === y && p.authorship === r.key).length)
          }));
        },
        leadTotals() {
          return Object.fromEntries(this.LEAD_ROLES.map(r => [r.key, this.pubs.filter(p => p.authorship === r.key).length]));
        },
        drawLeadChart() {
          const el = document.getElementById('leadChart');
          if (!el || !window.Chart) return;
          const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (CHARTS.lead) CHARTS.lead.destroy();
          CHARTS.lead = new Chart(el, {
            type: 'bar',
            data: { labels: this.years, datasets: this.leadSeries() },
            options: {
              responsive: true, maintainAspectRatio: false,
              animation: reduce ? false : { duration: 500 },
              interaction: { mode: 'index', intersect: false },
              scales: {
                x: { stacked: true, grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true } },
                y: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: 'Publications' } }
              },
              plugins: {
                legend: { position: 'bottom', reverse: true, labels: { boxWidth: 12, usePointStyle: true } },
                tooltip: { reverse: true, filter: item => item.raw > 0,
                           callbacks: { footer: items => 'Total: ' + items.reduce((s, i) => s + i.raw, 0) } }
              }
            }
          });
        },
        leadTableRows() {
          const s = this.leadSeries();
          return this.years.map((y, j) => ({ year: y, counts: s.map(d => d.data[j]) }));
        },

        // ---- (b) career timeline
        eraEnd(era) { return era.end ? era.end.slice(0, 4) : 'present'; },
        eraWidth(era) {
          const span = this.lastYear + 1 - this.firstYear;
          return Math.max(((era.pubYears[1] - era.pubYears[0] + 1) / span) * 100, 6) + '%';
        },

        // ---- (c) area cards
        areaPubs(i) { return this.pubs.filter(p => p.areaIndex === i); },
        areaYears(i) {
          const ys = this.areaPubs(i).map(p => p.year).filter(Boolean);
          return ys.length ? Math.min(...ys) + '-' + Math.max(...ys) : '';
        },
        highlights(area) {
          const nums = (this.info.highlights || {})[area] || [];
          return nums.map(n => this.pubs.find(p => String(p.number) === String(n))).filter(Boolean);
        },
        bestLink(p) { return p.links.pubmed || p.links.doi || p.links.pmc || null; },

        // ---- (d) grants gantt
        ym(s) { const [y, m] = s.split('-').map(Number); return y + (m - 1) / 12; },
        get ganttRange() {
          const all = [...this.grants.current, ...this.grants.previous].filter(g => g.start && g.end);
          const lo = Math.floor(Math.min(...all.map(g => this.ym(g.start))));
          const hi = Math.ceil(Math.max(...all.map(g => this.ym(g.end)) , new Date().getFullYear() + 1));
          return [lo, hi];
        },
        ganttTicks() {
          const [lo, hi] = this.ganttRange, ticks = [];
          const step = (hi - lo) > 12 ? 2 : 1;
          for (let y = lo; y <= hi; y += step) ticks.push({ year: y, left: ((y - lo) / (hi - lo)) * 100 + '%' });
          return ticks;
        },
        todayLeft() {
          const [lo, hi] = this.ganttRange, d = new Date();
          return ((d.getFullYear() + d.getMonth() / 12 - lo) / (hi - lo)) * 100 + '%';
        },
        ganttRows() {
          // Active awards first, then completed; newest start first inside each group
          const rank = g => (g.status === 'active' ? 0 : 1);
          const rows = [...this.grants.current, ...this.grants.previous]
            .filter(g => g.start && g.end)
            .sort((a, b) => rank(a) - rank(b) || b.start.localeCompare(a.start));
          const ordered = this.attachSupplements(rows);
          const eff = g => rank(g._under || g);  // a supplement stays in its parent's group
          const [lo, hi] = this.ganttRange;
          return ordered.map((g, i) => ({
            ...g,
            groupLabel: (i === 0 || eff(ordered[i - 1]) !== eff(g)) ? (eff(g) === 0 ? 'Active' : 'Completed') : '',
            left: ((this.ym(g.start) - lo) / (hi - lo)) * 100 + '%',
            width: ((this.ym(g.end) + 1 / 12 - this.ym(g.start)) / (hi - lo)) * 100 + '%',
            years: g.start.slice(0, 4) + '-' + g.end.slice(0, 4)
          }));
        },
        barColor(g) {
          if (g.status === 'active') return 'bg-primary-600';
          return g.type === 'internal' ? 'bg-amber-400' : 'bg-slate-500';
        },
        statusLabel(g) {
          if (g.status === 'active') return 'Active';
          return g.type === 'internal' ? 'Completed, UND internal' : 'Completed';
        },
        // An administrative supplement is its own row but not a separate award
        isSupplement(g) { return /^administrative supplement/i.test(g.title || ''); },
        // Move each supplement right under its parent award (matched by title; same rule as
        // cvlib.attach_supplements); one whose parent is not listed keeps its place
        attachSupplements(rows) {
          const key = t => (t || '').toLowerCase().replace(/^administrative supplement:\s*/, '').replace(/\s+/g, ' ').trim();
          const sups = rows.filter(g => this.isSupplement(g));
          const parents = new Set(rows.filter(g => !this.isSupplement(g)).map(g => key(g.title)));
          const out = [];
          for (const g of rows) {
            if (this.isSupplement(g) && parents.has(key(g.title))) continue;
            out.push(g);
            if (!this.isSupplement(g)) sups.filter(s => key(s.title) === key(g.title)).forEach(s => out.push({ ...s, _under: g }));
          }
          return out;
        },
        // ---- citation figures (NIH iCite; PubMed-indexed records only)
        withMetrics(list) { return list.filter(p => p.pmid && this.metrics[p.pmid]); },
        get citations() { return this.withMetrics(this.pubs).reduce((s, p) => s + (this.metrics[p.pmid].c || 0), 0); },
        get hIndex() {
          const cs = this.withMetrics(this.pubs).map(p => this.metrics[p.pmid].c || 0).sort((a, b) => b - a);
          return cs.filter((c, i) => c >= i + 1).length;
        },
        fmt(n) { return Number(n).toLocaleString('en-US'); },
        get metricsDateLong() {
          if (!this.metricsDate) return '';
          const [y, m, d] = this.metricsDate.split('-').map(Number);
          return new Date(y, m - 1, d).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        },
        impact(i) {   // same figures as the internal overview page
          const ps = this.areaPubs(i), withM = this.withMetrics(ps);
          if (!withM.length) return null;
          const M = this.metrics;
          const rcrs = withM.map(p => M[p.pmid].rcr).filter(v => v != null).sort((a, b) => a - b);
          const jp = ps.filter(p => p.category !== 'Book' && p.category !== 'Group authorship');
          const ledPct = jp.length ? Math.round(100 * jp.filter(p => this.isLed(p)).length / jp.length) : 0;
          const best = withM.slice().sort((a, b) => (M[b.pmid].c || 0) - (M[a.pmid].c || 0))[0];
          return {
            cites: withM.reduce((s, p) => s + (M[p.pmid].c || 0), 0),
            rcr: rcrs.length ? rcrs[Math.floor(rcrs.length / 2)] : null,
            top10: withM.filter(p => M[p.pmid].pct != null && M[p.pmid].pct >= 90).length,
            ledPct,
            best, bestCites: M[best.pmid].c || 0,
            bestTitle: best.title.length > 80 ? best.title.slice(0, 78) + '…' : best.title
          };
        },

        // ---- co-author network (js/coauthor-network.js)
        get hasNetwork() { return Object.keys(this.coauthors).length > 0; },
        mountNetwork() {
          const root = document.getElementById('netRoot');
          if (!root || !this.hasNetwork || !window.CoauthorNetwork) return;
          CoauthorNetwork.mount(root, {
            pubs: this.pubs.map(p => ({ id: p.number, year: p.year, theme: p.areaIndex + 1, title: p.title,
                                        venue: p.journal, link: this.bestLink(p) })),
            coauth: this.coauthors,
            themes: Object.fromEntries(this.areas.map((a, i) => [i + 1, a])),
            color: t => this.color(t - 1),
            piName: 'Dr. Hur'
          });
        },

        // ---- section navigator: lists every visible section, marks the current one
        mountSectionNav() {
          const nav = document.getElementById('sectionnav');
          if (!nav) return;
          const secs = [...document.querySelectorAll('main section[data-nav]')].filter(e => e.offsetParent !== null);
          nav.querySelector('.sn-inner').innerHTML = '<span class="sn-title">On this page</span>' +
            secs.map(e => `<a href="#${e.id}" data-id="${e.id}">${e.dataset.nav}</a>`).join('');
          const links = [...nav.querySelectorAll('a')];
          const spy = () => {
            let cur = secs[0].id;
            for (const e of secs) if (e.getBoundingClientRect().top <= window.innerHeight * 0.3) cur = e.id;
            if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1].id;
            links.forEach(a => {
              const on = a.dataset.id === cur;
              a.classList.toggle('on', on);
              if (on) {
                a.setAttribute('aria-current', 'true');
                const strip = a.parentElement;   // keep the current link visible in the narrow strip
                if (a.offsetLeft < strip.scrollLeft || a.offsetLeft + a.offsetWidth > strip.scrollLeft + strip.clientWidth)
                  strip.scrollLeft = a.offsetLeft - 16;
              }
              else a.removeAttribute('aria-current');
            });
          };
          addEventListener('scroll', spy, { passive: true });
          addEventListener('resize', spy);
          spy();
        },

        grantCount(status, type) {
          const list = status === 'active' ? this.grants.current : this.grants.previous;
          return list.filter(g => !this.isSupplement(g) && (!type || g.type === type)).length;
        }
      };
    }
  </script>
</head>
<body class="bg-surface font-sans text-gray-800 antialiased">

  <div id="nav-placeholder"></div>

  <main x-data="overview()">

    <!-- Hero -->
    <section class="bg-hero-pattern py-6 text-center">
      <div class="max-w-6xl mx-auto px-4" data-aos="fade-up">
        <h1 class="text-2xl md:text-3xl font-bold text-white">Research at a Glance</h1>
        <p class="text-sm md:text-base text-primary-200 mt-1">Publications, research areas, career path and funding of the Hur Lab</p>
        <ul class="flex flex-wrap justify-center gap-2 mt-3" x-show="info.researchInterests.length" x-cloak aria-label="Research interests">
          <template x-for="(r, i) in info.researchInterests" :key="i">
            <li class="px-3 py-1 rounded-full text-xs font-medium bg-white/10 text-white border border-white/20" x-text="r"></li>
          </template>
        </ul>
      </div>
    </section>

                    <div class="md:grid grid-cols-[minmax(0,3fr)_minmax(0,2fr)] items-center cursor-pointer" @click="open = !open">
                      <div class="px-3 pt-2 md:py-2 flex items-start gap-1.5">
                        <button type="button" class="mt-0.5 p-0.5 rounded text-gray-400 hover:text-gray-700 shrink-0"
                                :aria-expanded="open" :aria-label="(open ? 'Hide' : 'Show') + ' details for ' + g.title" @click.stop="open = !open">
                          <svg class="w-3.5 h-3.5 transition-transform" :class="open && 'rotate-90'" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                        </button>
                        <div class="min-w-0">
                          <p class="text-sm font-medium text-gray-900 leading-snug">
                            <template x-if="g.url"><a :href="g.url" target="_blank" rel="noopener" @click.stop class="hover:text-primary-700 hover:underline" x-text="g.title"></a></template>
                            <template x-if="!g.url"><span x-text="g.title"></span></template>
                          </p>
                          <p class="text-xs text-gray-500">
                            <span x-text="g.agency || g.funder"></span> · <span x-text="g.role"></span> · <span class="font-mono" x-text="g.years"></span>
                            <span class="ml-1 font-semibold" :class="g.status === 'active' ? 'text-primary-700' : 'text-gray-500'" x-text="statusLabel(g)"></span>
                          </p>
                        </div>
                      </div>
                      <div class="relative h-5 mx-4 mb-2 md:mb-0 md:mx-0 md:mr-4 bg-gray-50 md:bg-transparent rounded" aria-hidden="true">
                        <div class="absolute top-0 bottom-0 border-l border-dashed border-rose-400" :style="'left:' + todayLeft()"></div>
                        <div class="gantt-bar absolute top-1 bottom-1 rounded"
                             :class="barColor(g)"
                             :style="'left:' + g.left + ';width:' + g.width"></div>
                      </div>
                    </div>
                    <div x-show="open" x-cloak class="pl-9 pr-4 pb-2.5 text-xs text-gray-600 space-y-0.5">
                      <p x-show="g.award">Award number: <span class="font-mono" x-text="g.award"></span></p>
                      <p x-show="g.pis">PIs: <span x-text="g.pis"></span></p>
                      <p x-show="g.note" class="italic" x-text="g.note"></p>
                      <p x-show="g.url"><a :href="g.url" target="_blank" rel="noopener" class="text-primary-700 hover:underline" x-text="'Open ' + (g.linkLabel || 'link')"></a></p>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
            <p class="text-xs text-gray-500 mt-2">Dashed line: today.</p>
          </div>
        </section>

        <!-- Link to the full list -->
        <section class="py-8 bg-surface text-center">
          <a href="publications.html"
             class="inline-flex items-center px-8 py-3 bg-gray-900 hover:bg-gray-800 text-white font-semibold rounded-lg transition-colors">
            Search all publications
          </a>
        </section>

      </div>
    </template>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/coauthor-network.js"></script>
  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
