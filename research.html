<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research - Hur Lab</title>
  <meta name="description" content="Research areas of the Hur Lab at University of North Dakota">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/custom.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    function researchData() {
      return {
        research: null,
        grants: null,
        async init() {
          const [resRes, grantsRes] = await Promise.all([
            fetch('data/research.json'),
            fetch('data/grants.json')
          ]);
          this.research = await resRes.json();
          this.grants = await grantsRes.json();
          this.$nextTick(() => AOS.refresh());
        },
        iconSvg(name) {
          const icons = {
            dna: `<svg class="w-10 h-10" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M16 4C16 4 12 12 12 16C12 20 16 24 16 24C16 24 20 20 20 16C20 12 16 4 16 4Z" fill="currentColor" opacity="0.2"/>
              <path d="M32 4C32 4 28 12 28 16C28 20 32 24 32 24C32 24 36 20 36 16C36 12 32 4 32 4Z" fill="currentColor" opacity="0.2"/>
              <path d="M16 24C16 24 12 32 12 36C12 40 16 44 16 44C16 44 20 40 20 36C20 32 16 24 16 24Z" fill="currentColor" opacity="0.2"/>
              <path d="M32 24C32 24 28 32 28 36C28 40 32 44 32 44C32 44 36 40 36 36C36 32 32 24 32 24Z" fill="currentColor" opacity="0.2"/>
              <line x1="16" y1="10" x2="32" y2="14"/>
              <line x1="16" y1="18" x2="32" y2="22"/>
              <line x1="16" y1="30" x2="32" y2="34"/>
              <line x1="16" y1="38" x2="32" y2="42"/>
              <circle cx="16" cy="10" r="2" fill="currentColor"/>
              <circle cx="32" cy="14" r="2" fill="currentColor"/>
              <circle cx="16" cy="18" r="2" fill="currentColor"/>
              <circle cx="32" cy="22" r="2" fill="currentColor"/>
              <circle cx="16" cy="30" r="2" fill="currentColor"/>
              <circle cx="32" cy="34" r="2" fill="currentColor"/>
              <circle cx="16" cy="38" r="2" fill="currentColor"/>
              <circle cx="32" cy="42" r="2" fill="currentColor"/>
            </svg>`,
            database: `<svg class="w-10 h-10" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="8" y="6" width="14" height="10" rx="2" fill="currentColor" opacity="0.2"/>
              <rect x="26" y="6" width="14" height="10" rx="2" fill="currentColor" opacity="0.2"/>
              <rect x="8" y="32" width="14" height="10" rx="2" fill="currentColor" opacity="0.2"/>
              <rect x="26" y="32" width="14" height="10" rx="2" fill="currentColor" opacity="0.2"/>
              <circle cx="24" cy="24" r="5" fill="currentColor" opacity="0.3"/>
              <line x1="15" y1="16" x2="21" y2="21"/>
              <line x1="33" y1="16" x2="27" y2="21"/>
              <line x1="15" y1="32" x2="21" y2="27"/>
              <line x1="33" y1="32" x2="27" y2="27"/>
            </svg>`,
            chip: `<svg class="w-10 h-10" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="24" cy="24" r="14" fill="currentColor" opacity="0.1"/>
              <circle cx="24" cy="24" r="8" fill="currentColor" opacity="0.15"/>
              <circle cx="24" cy="18" r="2" fill="currentColor"/>
              <circle cx="20" cy="26" r="2" fill="currentColor"/>
              <circle cx="28" cy="26" r="2" fill="currentColor"/>
              <line x1="24" y1="18" x2="20" y2="26"/>
              <line x1="24" y1="18" x2="28" y2="26"/>
              <line x1="20" y1="26" x2="28" y2="26"/>
              <line x1="24" y1="10" x2="24" y2="14"/>
              <line x1="24" y1="34" x2="24" y2="38"/>
              <line x1="10" y1="24" x2="14" y2="24"/>
              <line x1="34" y1="24" x2="38" y2="24"/>
              <line x1="14" y1="14" x2="17" y2="17"/>
              <line x1="31" y1="31" x2="34" y2="34"/>
              <line x1="34" y1="14" x2="31" y2="17"/>
              <line x1="17" y1="31" x2="14" y2="34"/>
            </svg>`,
            brain: `<svg class="w-10 h-10" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M24 6C16 6 10 12 10 20C10 26 13 30 16 32V38H32V32C35 30 38 26 38 20C38 12 32 6 24 6Z" fill="currentColor" opacity="0.15"/>
              <path d="M24 6C16 6 10 12 10 20C10 26 13 30 16 32V38H32V32C35 30 38 26 38 20C38 12 32 6 24 6Z"/>
              <line x1="18" y1="38" x2="18" y2="42"/>
              <line x1="24" y1="38" x2="24" y2="44"/>
              <line x1="30" y1="38" x2="30" y2="42"/>
              <path d="M16 22C18 20 20 22 22 20C24 18 26 20 28 18C30 16 32 18 34 16" stroke-width="2.5"/>
              <circle cx="17" cy="18" r="1.5" fill="currentColor"/>
              <circle cx="31" cy="18" r="1.5" fill="currentColor"/>
            </svg>`,
            shield: `<svg class="w-10 h-10" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M24 4L28 10L36 8L34 16L42 18L38 24L42 30L34 32L36 40L28 38L24 44L20 38L12 40L14 32L6 30L10 24L6 18L14 16L12 8L20 10Z" fill="currentColor" opacity="0.12"/>
              <path d="M24 4L28 10L36 8L34 16L42 18L38 24L42 30L34 32L36 40L28 38L24 44L20 38L12 40L14 32L6 30L10 24L6 18L14 16L12 8L20 10Z"/>
              <circle cx="24" cy="24" r="7" fill="currentColor" opacity="0.15"/>
              <circle cx="24" cy="21" r="1.5" fill="currentColor"/>
              <circle cx="21" cy="26" r="1.5" fill="currentColor"/>
              <circle cx="27" cy="26" r="1.5" fill="currentColor"/>
            </svg>`
          };
          return icons[name] || icons['dna'];
        },
        iconColorClass(color) {
          return color === 'indigo' ? 'text-accent-600' : 'text-primary-600';
        },
        iconBgClass(color) {
          return color === 'indigo' ? 'bg-accent-50' : 'bg-primary-50';
        },
        sectionBg(index) {
          return index % 2 === 0 ? 'bg-white' : 'bg-primary-50';
        },
        grantBadgeClass(index) {
          return index % 2 === 0 ? 'bg-primary-500/20 text-primary-300' : 'bg-accent-500/20 text-accent-300';
        },
        grantBadgeLabel(grant) {
          const funder = grant.funder || '';
          const parts = funder.split(/\s+/);
          // Extract meaningful short label: e.g. "NIH/NIAID U24" or "ARPA-H"
          if (funder.startsWith('ARPA-H')) return 'ARPA-H';
          if (funder.startsWith('NIGMS')) {
            const match = funder.match(/(NIGMS\s+P20)/);
            return match ? 'NIH/' + match[1] : funder.substring(0, 20);
          }
          // Pattern like "NIH/NIAID U24 ..."
          const m = funder.match(/^(NIH\/\w+\s+\w+)/);
          if (m) return m[1];
          return funder.substring(0, 20);
        }
      };
    }
  </script>
</head>
<body class="bg-surface font-sans text-gray-800 antialiased">

  <!-- Navigation -->
  <div id="nav-placeholder"></div>

  <div x-data="researchData()">

    <!-- Hero Banner -->
    <section class="bg-hero-pattern py-20 text-center pt-36">
      <div class="max-w-4xl mx-auto px-4">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4" data-aos="fade-up">Research</h1>
        <p class="text-lg md:text-xl text-primary-200 max-w-2xl mx-auto" data-aos="fade-up" data-aos-delay="100"
           x-text="research ? research.intro : 'Loading...'">
        </p>
      </div>
    </section>

    <!-- Research Areas -->
    <template x-if="research">
      <div>
        <template x-for="(area, index) in research.areas" :key="index">
          <section :class="sectionBg(index) + ' py-16 md:py-20'">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex flex-col md:flex-row items-start gap-8 md:gap-12" data-aos="fade-up">
                <!-- Icon -->
                <div class="flex-shrink-0 w-20 h-20 rounded-2xl flex items-center justify-center"
                     :class="iconBgClass(area.color)">
                  <div :class="iconColorClass(area.color)" x-html="iconSvg(area.icon)"></div>
                </div>
                <!-- Content -->
                <div>
                  <h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-4" x-text="area.title"></h2>
                  <p class="text-gray-600 text-lg leading-relaxed mb-4" x-text="area.description"></p>
                  <a :href="'research-detail.html?area=' + index"
                     class="inline-flex items-center text-sm font-semibold transition-colors"
                     :class="area.color === 'indigo' ? 'text-accent-600 hover:text-accent-700' : 'text-primary-600 hover:text-primary-700'">
                    Learn more
                    <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                  </a>
                </div>
              </div>
            </div>
          </section>
        </template>
      </div>
    </template>

    <!-- Funded Grants Section -->
    <template x-if="grants">
      <section class="bg-surface-dark py-16 md:py-24">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="text-center mb-12" data-aos="fade-up">
            <h2 class="text-3xl md:text-4xl font-bold text-white mb-4">Funded Grants</h2>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto">Active research funding supporting our computational biology and AI initiatives.</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <template x-for="(grant, index) in grants.current" :key="index">
              <div class="bg-white/5 backdrop-blur border border-white/10 rounded-xl p-6 card-hover"
                   data-aos="fade-up" :data-aos-delay="index * 50">
                <div class="flex items-center gap-3 mb-3">
                  <span class="inline-block px-3 py-1 text-xs font-semibold rounded-full"
                        :class="grantBadgeClass(index)"
                        x-text="grantBadgeLabel(grant)"></span>
                  <span class="text-xs text-gray-400 font-mono" x-text="grant.role"></span>
                </div>
                <h3 class="text-lg font-semibold text-white mb-2" x-text="grant.title"></h3>
                <div class="flex flex-col gap-1">
                  <p class="text-gray-400 text-sm" x-text="grant.total"></p>
                  <p class="text-gray-400 text-sm" x-text="grant.period"></p>
                </div>
              </div>
            </template>
          </div>
        </div>
      </section>
    </template>

    <!-- Last Updated -->
    <template x-if="research && research.lastUpdated">
      <div class="bg-surface py-4 text-center">
        <p class="text-sm text-gray-400">Last updated: <span x-text="research.lastUpdated"></span></p>
      </div>
    </template>

  </div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="js/components.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
